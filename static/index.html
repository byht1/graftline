<!doctype html>
<html lang="en" data-theme="graftline">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Graftline</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <meta name="theme-color" content="#14B8A6">
  <link rel="stylesheet" href="/style.css">
  <!--gl-prefs-->
  <script>
    // ui.js stores the theme as JSON ("one-dark-pro" with quotes); also accept a plain value.
    try {
      const forced = new URLSearchParams(location.hash.slice(1)).get('theme');
      const raw = localStorage.getItem('gl.theme');
      let t = raw;
      try { t = JSON.parse(raw); } catch {}
      if (forced) t = forced;
      // No saved choice: follow the system light / dark setting.
      if (!t) t = matchMedia('(prefers-color-scheme: light)').matches ? 'graftline-light' : 'graftline';
      if (typeof t === 'string') document.documentElement.dataset.theme = t;
    } catch {}
  </script>
</head>
<body>
  <div id="app">
    <aside id="sidebar"></aside>
    <div id="sidebar-resizer"></div>
    <main id="main"></main>
  </div>
  <div id="toasts"></div>
  <script type="module" src="/app.js"></script>
</body>
</html>
