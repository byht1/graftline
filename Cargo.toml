[package]
name = "graftline"
version = "0.1.0"
edition = "2021"
description = "Graftline: a fast desktop Git client built around the commit graph"
license = "MIT"
default-run = "graftline"
repository = "https://github.com/byht1/graftline"
homepage = "https://byht1.github.io/graftline/"
readme = "README.md"
keywords = ["git", "gui", "commit-graph", "desktop"]

[lib]
name = "graftline"
path = "src/lib.rs"

# Desktop app: a native window drawn with GPUI, no console.
[[bin]]
name = "graftline"
path = "src/main.rs"
required-features = ["desktop"]

# Development tool: measures how long the commit graph of a repository takes to load.
[[bin]]
name = "graftline-bench"
path = "src/bin/bench.rs"

[features]
default = ["desktop"]
desktop = ["dep:gpui"]

[dependencies]
anyhow = "1"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
# GPUI needs xattr 0.2.3 (through its HTTP client). That crate uses libc::ENOATTR, which libc
# 0.2.191 removed on Linux, so Cargo.lock keeps libc at 0.2.189. Do not run a plain `cargo update`.
gpui = { version = "0.2.2", optional = true }
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
notify = "8.2.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "io-util", "time", "macros"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"
