[package]
name = "graftline"
version = "0.1.0"
edition = "2021"
description = "Graftline: a fast desktop Git client built around the commit graph"
license = "MIT"
default-run = "graftline"
repository = "https://github.com/byht1/graftline"
homepage = "https://byht1.github.io/graftline/"
readme = "README.md"
keywords = ["git", "gui", "commit-graph", "desktop"]

[lib]
name = "graftline"
path = "src/lib.rs"

# Desktop app: its own window (WebView2 / WKWebView / WebKitGTK), no console, no browser.
[[bin]]
name = "graftline"
path = "src/bin/desktop.rs"
required-features = ["desktop"]

# Development tool: the same UI served to a browser on a fixed port.
[[bin]]
name = "graftline-server"
path = "src/main.rs"

[features]
default = ["desktop"]
desktop = ["dep:tao", "dep:wry", "dep:rfd", "dep:muda"]

[dependencies]
anyhow = "1"
axum = "0.8"
clap = { version = "4", features = ["derive", "env"] }
dirs = "6"
futures = "0.3"
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }
notify = "8.2.2"
open = "5"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = { version = "0.17.2", optional = true }
ring = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = { version = "0.37.2", optional = true }
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
tower-http = { version = "0.7.1", features = ["catch-panic"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
wry = { version = "0.57.1", optional = true }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true

[target."cfg(windows)".build-dependencies]
winresource = "0.1.34"

[target.'cfg(target_os = "macos")'.dependencies]
muda = { version = "0.21.2", optional = true }
