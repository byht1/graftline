name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Linux, os: ubuntu-22.04 }
          - { name: Windows, os: windows-latest }
          - { name: macOS, os: macos-15 }
    steps:
      - uses: actions/checkout@v4
      - name: Install the libraries GPUI links to
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libxkbcommon-x11-dev libwayland-dev libfontconfig1-dev libfreetype6-dev libxcb1-dev libx11-xcb-dev libvulkan-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # The tests create their own repositories and use the git of the runner.
      - run: cargo test
      - run: cargo build --release
      - name: The app starts and reports its version
        shell: bash
        run: ./target/release/graftline --version
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: graftline-windows
          path: target/release/graftline.exe
